---
# Release CI Pipeline
# Builds and publishes desktop apps for macOS, Windows, and Linux

name: Release

"on":
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g., v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.95.0
  # Kept explicitly empty and mirrored by the warm-release-cache job in
  # ci.yml: RUSTFLAGS is part of both the rust-cache key and cargo's
  # fingerprints, so any mismatch makes the warmed cache unusable.
  RUSTFLAGS: ''

jobs:
  # ============================================================================
  # CREATE RELEASE
  # ============================================================================
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.get_version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Get version from tag
        id: get_version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            printf 'VERSION=%s\n' "$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            printf 'VERSION=%s\n' "${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify tag matches app version
        env:
          RELEASE_TAG: ${{ steps.get_version.outputs.VERSION }}
        run: |
          CARGO_VERSION=$(sed -nE 's/^version = "([^"]+)"$/\1/p' Cargo.toml | head -1)
          TAURI_VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "$RELEASE_TAG" != "v$CARGO_VERSION" ] || [ "$CARGO_VERSION" != "$TAURI_VERSION" ]; then
            echo "Tag $RELEASE_TAG does not match Cargo.toml ($CARGO_VERSION) or tauri.conf.json ($TAURI_VERSION)."
            echo "Cut releases with 'just release X.Y.Z' so packages are named after the release version."
            exit 1
          fi

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.get_version.outputs.VERSION }}
        run: |
          gh release create "$RELEASE_TAG" \
            --title "Youtun4 $RELEASE_TAG" \
            --draft \
            --generate-notes

  # ============================================================================
  # BUILD MACOS (Universal Binary - Intel + Apple Silicon)
  # ============================================================================
  build-macos:
    name: Build macOS
    needs: create-release
    runs-on: macos-latest
    permissions:
      contents: write
    environment:
      name: release
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install "${{ env.RUST_TOOLCHAIN }}" --profile minimal
          rustup default "${{ env.RUST_TOOLCHAIN }}"
            rustup target add --toolchain "${{ env.RUST_TOOLCHAIN }}" \
              aarch64-apple-darwin \
              x86_64-apple-darwin

      - name: Add WASM target
        run: rustup target add wasm32-unknown-unknown

      # Restore the release-profile dependency cache warmed on main by
      # ci.yml's warm-release-cache job. Caches created on tag refs are
      # invisible to later tags, so saving here would be wasted upload time.
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          shared-key: release-build
          save-if: "false"

      # Prebuilt binaries (tauri-cli via the cargo-binstall fallback)
      # instead of compiling both tools from source (~13 min per job).
      - name: Install trunk and Tauri CLI
        uses: taiki-e/install-action@7a562dfa955aa2e4d5b0fd6ebd57ff9715c07b0b # v2.73.0
        with:
          tool: trunk,tauri-cli

      # No explicit trunk build — cargo tauri build runs beforeBuildCommand
      - name: Build macOS app (Universal)
        run: cargo tauri build --target universal-apple-darwin
        env:
          # yamllint disable rule:line-length
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # yamllint enable rule:line-length

      - name: Upload macOS artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            target/universal-apple-darwin/release/bundle/dmg/*.dmg \
            --clobber

  # ============================================================================
  # BUILD WINDOWS
  # ============================================================================
  build-windows:
    name: Build Windows
    needs: create-release
    runs-on: windows-latest
    permissions:
      contents: write
    environment:
      name: release
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install "${{ env.RUST_TOOLCHAIN }}" --profile minimal
          rustup default "${{ env.RUST_TOOLCHAIN }}"

      - name: Add WASM target
        run: rustup target add wasm32-unknown-unknown

      # Restore the release-profile dependency cache warmed on main by
      # ci.yml's warm-release-cache job. Caches created on tag refs are
      # invisible to later tags, so saving here would be wasted upload time.
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          shared-key: release-build
          save-if: "false"

      # Prebuilt binaries (tauri-cli via the cargo-binstall fallback)
      # instead of compiling both tools from source (~13 min per job).
      - name: Install trunk and Tauri CLI
        uses: taiki-e/install-action@7a562dfa955aa2e4d5b0fd6ebd57ff9715c07b0b # v2.73.0
        with:
          tool: trunk,tauri-cli

      # No explicit trunk build — cargo tauri build runs beforeBuildCommand
      - name: Build Windows app
        run: cargo tauri build
        env:
          # yamllint disable rule:line-length
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # yamllint enable rule:line-length

      - name: Upload Windows installers
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            target/release/bundle/msi/*.msi \
            target/release/bundle/nsis/*.exe \
            --clobber

  # ============================================================================
  # BUILD LINUX
  # ============================================================================
  build-linux:
    name: Build Linux
    needs: create-release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    environment:
      name: release
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Install Rust
        run: |
          rustup toolchain install "${{ env.RUST_TOOLCHAIN }}" --profile minimal
          rustup default "${{ env.RUST_TOOLCHAIN }}"

      - name: Add WASM target
        run: rustup target add wasm32-unknown-unknown

      # Restore the release-profile dependency cache warmed on main by
      # ci.yml's warm-release-cache job. Caches created on tag refs are
      # invisible to later tags, so saving here would be wasted upload time.
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          shared-key: release-build
          save-if: "false"

      # Prebuilt binaries (tauri-cli via the cargo-binstall fallback)
      # instead of compiling both tools from source (~13 min per job).
      - name: Install trunk and Tauri CLI
        uses: taiki-e/install-action@7a562dfa955aa2e4d5b0fd6ebd57ff9715c07b0b # v2.73.0
        with:
          tool: trunk,tauri-cli

      # No explicit trunk build — cargo tauri build runs beforeBuildCommand
      - name: Build Linux app
        run: cargo tauri build
        env:
          # yamllint disable rule:line-length
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # yamllint enable rule:line-length

      - name: Upload Linux packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            target/release/bundle/deb/*.deb \
            target/release/bundle/appimage/*.AppImage \
            --clobber

  # ============================================================================
  # PUBLISH RELEASE
  # ============================================================================
  publish-release:
    name: Publish Release
    needs: [create-release, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false
