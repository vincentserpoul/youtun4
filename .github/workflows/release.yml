---
# Release CI Pipeline
# Builds and publishes desktop apps for macOS, Windows, and Linux

name: Release

"on":
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g., v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.97.1
  # Kept explicitly empty and mirrored by the warm-release-cache job in
  # ci.yml: RUSTFLAGS is part of both the rust-cache key and cargo's
  # fingerprints, so any mismatch makes the warmed cache unusable.
  RUSTFLAGS: ''

jobs:
  # ============================================================================
  # CREATE RELEASE
  # ============================================================================
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.get_version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Get version from tag
        id: get_version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            printf 'VERSION=%s\n' "$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            printf 'VERSION=%s\n' "${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify tag matches app version
        env:
          RELEASE_TAG: ${{ steps.get_version.outputs.VERSION }}
        run: |
          CARGO_VERSION=$(sed -nE 's/^version = "([^"]+)"$/\1/p' Cargo.toml | head -1)
          TAURI_VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "$RELEASE_TAG" != "v$CARGO_VERSION" ] || [ "$CARGO_VERSION" != "$TAURI_VERSION" ]; then
            echo "Tag $RELEASE_TAG does not match Cargo.toml ($CARGO_VERSION) or tauri.conf.json ($TAURI_VERSION)."
            echo "Cut releases with 'just release X.Y.Z' so packages are named after the release version."
            exit 1
          fi

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.get_version.outputs.VERSION }}
        run: |
          gh release create "$RELEASE_TAG" \
            --title "Youtun4 $RELEASE_TAG" \
            --draft \
            --generate-notes

  # ============================================================================
  # BUILD MACOS (Universal Binary - Intel + Apple Silicon)
  # ============================================================================
  build-macos:
    name: Build macOS
    needs: create-release
    runs-on: macos-latest
    permissions:
      contents: write
    environment:
      name: release
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install "${{ env.RUST_TOOLCHAIN }}" --profile minimal
          rustup default "${{ env.RUST_TOOLCHAIN }}"
            rustup target add --toolchain "${{ env.RUST_TOOLCHAIN }}" \
              aarch64-apple-darwin \
              x86_64-apple-darwin

      - name: Add WASM target
        run: rustup target add wasm32-unknown-unknown

      # Restore the release-profile dependency cache warmed on main by
      # ci.yml's warm-release-cache job. Caches created on tag refs are
      # invisible to later tags, so saving here would be wasted upload time.
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          shared-key: release-build
          save-if: "false"

      # Prebuilt binaries (tauri-cli via the cargo-binstall fallback)
      # instead of compiling both tools from source (~13 min per job).
      - name: Install trunk and Tauri CLI
        uses: taiki-e/install-action@7a562dfa955aa2e4d5b0fd6ebd57ff9715c07b0b # v2.73.0
        with:
          tool: trunk,tauri-cli

      # No explicit trunk build — cargo tauri build runs beforeBuildCommand
      - name: Build macOS app (Universal)
        run: cargo tauri build --target universal-apple-darwin
        env:
          # yamllint disable rule:line-length
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # yamllint enable rule:line-length

      - name: Upload macOS artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            target/universal-apple-darwin/release/bundle/dmg/*.dmg \
            target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz \
            target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig \
            --clobber

  # ============================================================================
  # BUILD WINDOWS
  # ============================================================================
  build-windows:
    name: Build Windows
    needs: create-release
    runs-on: windows-latest
    permissions:
      contents: write
    environment:
      name: release
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install "${{ env.RUST_TOOLCHAIN }}" --profile minimal
          rustup default "${{ env.RUST_TOOLCHAIN }}"

      - name: Add WASM target
        run: rustup target add wasm32-unknown-unknown

      # Restore the release-profile dependency cache warmed on main by
      # ci.yml's warm-release-cache job. Caches created on tag refs are
      # invisible to later tags, so saving here would be wasted upload time.
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          shared-key: release-build
          save-if: "false"

      # Prebuilt binaries (tauri-cli via the cargo-binstall fallback)
      # instead of compiling both tools from source (~13 min per job).
      - name: Install trunk and Tauri CLI
        uses: taiki-e/install-action@7a562dfa955aa2e4d5b0fd6ebd57ff9715c07b0b # v2.73.0
        with:
          tool: trunk,tauri-cli

      # No explicit trunk build — cargo tauri build runs beforeBuildCommand
      - name: Build Windows app
        run: cargo tauri build
        env:
          # yamllint disable rule:line-length
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # yamllint enable rule:line-length

      - name: Upload Windows installers
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          # Only the NSIS signature is published: it is the installer the
          # updater consumes, and a second *.exe.sig would make the manifest
          # step ambiguous about which asset serves windows-x86_64.
          gh release upload "$RELEASE_TAG" \
            target/release/bundle/msi/*.msi \
            target/release/bundle/nsis/*.exe \
            target/release/bundle/nsis/*.exe.sig \
            --clobber

  # ============================================================================
  # BUILD LINUX
  # ============================================================================
  build-linux:
    name: Build Linux
    needs: create-release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    environment:
      name: release
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Install Rust
        run: |
          rustup toolchain install "${{ env.RUST_TOOLCHAIN }}" --profile minimal
          rustup default "${{ env.RUST_TOOLCHAIN }}"

      - name: Add WASM target
        run: rustup target add wasm32-unknown-unknown

      # Restore the release-profile dependency cache warmed on main by
      # ci.yml's warm-release-cache job. Caches created on tag refs are
      # invisible to later tags, so saving here would be wasted upload time.
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          shared-key: release-build
          save-if: "false"

      # Prebuilt binaries (tauri-cli via the cargo-binstall fallback)
      # instead of compiling both tools from source (~13 min per job).
      - name: Install trunk and Tauri CLI
        uses: taiki-e/install-action@7a562dfa955aa2e4d5b0fd6ebd57ff9715c07b0b # v2.73.0
        with:
          tool: trunk,tauri-cli

      # No explicit trunk build — cargo tauri build runs beforeBuildCommand
      - name: Build Linux app
        run: cargo tauri build
        env:
          # yamllint disable rule:line-length
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # yamllint enable rule:line-length

      - name: Upload Linux packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          # .deb has no updater signature: Debian packages cannot self-update,
          # the AppImage is what the updater replaces on Linux.
          gh release upload "$RELEASE_TAG" \
            target/release/bundle/deb/*.deb \
            target/release/bundle/appimage/*.AppImage \
            target/release/bundle/appimage/*.AppImage.sig \
            --clobber

  # ============================================================================
  # PUBLISH RELEASE
  # ============================================================================
  publish-release:
    name: Publish Release
    needs: [create-release, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      # The in-app updater reads latest.json from the *latest published*
      # release, so the manifest has to be attached before the draft is
      # published. Signatures are taken from the .sig files the build jobs
      # uploaded; each one names the asset it signs.
      - name: Build updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p sigs
          cd sigs
          gh release download "$RELEASE_TAG" --repo "$REPO" --pattern '*.sig'

          BASE_URL="https://github.com/$REPO/releases/download/$RELEASE_TAG"
          PLATFORMS='{}'

          # add_platform <signature-file> <platform-key>...
          add_platform() {
            local sig_file="$1"
            local signature url key
            signature=$(cat "$sig_file")
            url="$BASE_URL/$(basename "${sig_file%.sig}")"
            shift
            for key in "$@"; do
              PLATFORMS=$(jq --arg k "$key" --arg s "$signature" --arg u "$url" \
                '.[$k] = {signature: $s, url: $u}' <<<"$PLATFORMS")
            done
          }

          for sig_file in *.sig; do
            case "$sig_file" in
              # The universal macOS bundle serves both architectures
              *.app.tar.gz.sig) add_platform "$sig_file" darwin-aarch64 darwin-x86_64 ;;
              *.AppImage.sig) add_platform "$sig_file" linux-x86_64 ;;
              *-setup.exe.sig) add_platform "$sig_file" windows-x86_64 ;;
              *) echo "Ignoring unrecognised signature: $sig_file" ;;
            esac
          done

          if [ "$(jq 'length' <<<"$PLATFORMS")" -eq 0 ]; then
            echo "No updater signatures found; refusing to publish an empty manifest."
            echo "Check that bundle.createUpdaterArtifacts is enabled and the signing key is set."
            exit 1
          fi

          jq -n \
            --arg version "${RELEASE_TAG#v}" \
            --arg notes "$(gh release view "$RELEASE_TAG" --repo "$REPO" --json body -q .body)" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson platforms "$PLATFORMS" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms}' \
            > latest.json

          jq -r '.platforms | keys[]' latest.json | sed 's/^/Manifest covers: /'
          gh release upload "$RELEASE_TAG" latest.json --repo "$REPO" --clobber

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false
