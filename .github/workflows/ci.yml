---
# CI Pipeline
# Runs build and tests on every PR and push to main

# The Rust version, components and targets come from rust-toolchain.toml:
# `rustup toolchain install` with no arguments installs exactly that.

name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # ============================================================================
  # FORMAT CHECK
  # ============================================================================
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install

      - name: Check formatting
        run: cargo fmt --all -- --check

  # ============================================================================
  # CLIPPY LINT
  # ============================================================================
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Install Rust
        run: rustup toolchain install

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Same command as `just clippy`. Lint levels live in [workspace.lints]
      # in Cargo.toml; -D warnings turns every one of them into an error.
      - name: Run Clippy
        run: >-
          cargo clippy --workspace --all-targets --all-features
          -- -D warnings

  # ============================================================================
  # PRE-COMMIT HOOKS
  # ============================================================================
  # Runs every hook from .pre-commit-config.yaml (typos, taplo, yamllint,
  # actionlint, zizmor, gitleaks, ...) so they are enforced even when a
  # contributor has not run `just setup`.
  hooks:
    name: Pre-commit Hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run hooks
        uses: j178/prek-action@7b101f8338a08d2bd6fdb3625e4e7692428763a3 # v3.1.1
        env:
          # Covered by the Format and Clippy jobs, which have the system
          # libraries these two need.
          SKIP: cargo-fmt,cargo-clippy

  # ============================================================================
  # UNUSED DEPENDENCIES
  # ============================================================================
  # Licenses and advisories (cargo-deny, cargo-audit) run in security.yml.
  deps:
    name: Unused Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-machete
        uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-machete

      - name: Check unused dependencies
        run: cargo machete

  # ============================================================================
  # BUILD & TEST
  # ============================================================================
  build:
    name: Build & Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Install Rust
        run: rustup toolchain install

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build workspace
        run: cargo build --all-targets

      - name: Run tests
        run: cargo test --all-targets

  # ============================================================================
  # CODE COVERAGE
  # ============================================================================
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    environment:
      name: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Install Rust
        run: rustup toolchain install

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-llvm-cov

      - name: Install cargo-nextest
        uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-nextest

      - name: Generate coverage report
        run: |
          mkdir -p coverage
          cargo llvm-cov nextest \
            --workspace \
            --exclude youtun4-ui \
            --exclude youtun4 \
            --codecov \
            --output-path coverage/codecov.json

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/codecov.json
          fail_ci_if_error: false
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}

  # ============================================================================
  # BUILD WASM UI
  # ============================================================================
  build-wasm:
    name: Build WASM UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install

      - name: Install just
        uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: just

      - name: Cache CI tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .bin
          key: ci-tools-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Install CI tools
        run: |
          just install-ci-tools
          echo "$PWD/.bin" >> "$GITHUB_PATH"

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build frontend
        run: trunk build --release

  # ============================================================================
  # DOCUMENTATION
  # ============================================================================
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Install Rust
        run: rustup toolchain install

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build documentation
        run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  # ============================================================================
  # MUTATION TESTING (manual trigger only — runs every test for every mutation)
  # ============================================================================
  mutants:
    name: Mutation Testing
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Install Rust
        run: rustup toolchain install

      - name: Install cargo-mutants
        uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-mutants

      - name: Install cargo-nextest
        uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-nextest

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Run mutation testing
        run: cargo mutants --workspace --exclude youtun4-ui --exclude youtun4 -- --test-threads=4

  # ============================================================================
  # WARM RELEASE CACHE
  # ============================================================================
  # Builds the release profile on pushes to main so tag-triggered release
  # builds restore a warm dependency cache. GitHub cache is ref-scoped: a
  # cache saved by one tag is invisible to later tags, so main is the only
  # place a reusable release cache can be produced. After the first run this
  # job is incremental (only changed crates rebuild).
  warm-release-cache:
    name: Warm Release Cache
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Must match the runners used by release.yml build jobs.
        os: [ubuntu-22.04, macos-latest, windows-latest]
    env:
      # release.yml builds without -D warnings; RUSTFLAGS is part of the
      # cache key and cargo fingerprints, so it must match exactly.
      RUSTFLAGS: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Install Rust
        run: rustup toolchain install

      - name: Add macOS universal targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-build

      # tauri::generate_context! embeds frontendDist at compile time and
      # fails if the directory is missing; an empty one is enough to warm
      # every dependency.
      - name: Create placeholder frontend dist
        shell: bash
        run: mkdir -p dist

      - name: Build release profile (WASM UI)
        run: >-
          cargo build --release --target wasm32-unknown-unknown
          -p youtun4-ui --features _wasm_bin

      - name: Build release profile (native)
        if: runner.os != 'macOS'
        run: cargo build --release -p youtun4

      - name: Build release profile (macOS universal targets)
        if: runner.os == 'macOS'
        run: |
          cargo build --release -p youtun4 --target aarch64-apple-darwin
          cargo build --release -p youtun4 --target x86_64-apple-darwin
