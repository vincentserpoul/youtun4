# Cargo configuration for the workspace

# Use sccache to cache compiled artifacts (install via `just install-ci-tools`)
# Set RUSTC_WRAPPER="" to disable if sccache is not installed
[build]
rustc-wrapper = "sccache"

[target.wasm32-unknown-unknown]
# Enable bulk memory operations for WASM (required for memory.copy)
rustflags = ["-C", "target-feature=+bulk-memory"]

# Use mold linker on Linux for faster link times
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[target.aarch64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]
