# Cargo configuration for the workspace

# To enable sccache locally, set: export RUSTC_WRAPPER=sccache
# In CI, this is set per-job via the sccache-action step.

[target.wasm32-unknown-unknown]
# Enable bulk memory operations for WASM (required for memory.copy)
rustflags = ["-C", "target-feature=+bulk-memory"]

# Use mold linker on Linux for faster link times
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[target.aarch64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]
