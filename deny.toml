# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

# ============================================================================
# ADVISORIES
# Checks for known security vulnerabilities in dependencies
# ============================================================================
[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# No advisories are currently ignored. If an unmaintained transitive dependency
# we cannot upgrade ourselves shows up, list its RUSTSEC id here with a comment,
# and prune it once it no longer matches (cargo-deny warns `advisory-not-detected`).
ignore = []

# ============================================================================
# LICENSES
# Checks dependency licenses against an allowlist
# ============================================================================
[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "LGPL-3.0-only", # mp3lame-encoder/mp3lame-sys (LAME MP3 encoder bindings)
]
confidence-threshold = 0.8

# mp3lame-encoder / mp3lame-sys declare the deprecated SPDX id "LGPL-3.0".
# Map it to the modern "LGPL-3.0-only" so cargo-deny stops warning about it.
[[licenses.clarify]]
name = "mp3lame-encoder"
expression = "LGPL-3.0-only"
license-files = []

[[licenses.clarify]]
name = "mp3lame-sys"
expression = "LGPL-3.0-only"
license-files = []

# ============================================================================
# BANS
# Deny or allow specific crates or versions
# ============================================================================
[bans]
# Duplicate crate versions are all transitive (Tauri, Leptos, html5ever, icu)
# and not something we can resolve from this workspace, so don't warn.
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"
deny = []
skip = []
skip-tree = []

# ============================================================================
# SOURCES
# Controls where crates can be sourced from
# ============================================================================
[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
# Allow rusty_ytdl from Mithronn's fork
github = ["Mithronn"]
