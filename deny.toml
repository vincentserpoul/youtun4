# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

# ============================================================================
# ADVISORIES
# Checks for known security vulnerabilities in dependencies
# ============================================================================
[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Ignore unmaintained crate advisories for transitive dependencies we cannot
# upgrade ourselves. Entries that no longer match any crate make cargo-deny
# emit `advisory-not-detected` warnings, so prune them when deps are updated.
ignore = [
    # Unmaintained transitive dependencies (via Tauri / Leptos / Symphonia)
    "RUSTSEC-2024-0370", # proc-macro-error
    "RUSTSEC-2024-0384", # instant
    "RUSTSEC-2024-0388", # derivative
    "RUSTSEC-2024-0436", # paste
    "RUSTSEC-2025-0057", # fxhash
    # zbus 5.x sub-crates were merged into zbus 6.0 and marked unmaintained.
    # They are only pulled in by tauri-plugin-opener on Linux, which still
    # depends on zbus ^5.9 (also in its 3.0.0-alpha releases). Remove once
    # tauri-plugin-opener ships a release on zbus 6.
    "RUSTSEC-2026-0370", # zvariant
    "RUSTSEC-2026-0371", # zbus_names
    "RUSTSEC-2026-0372", # zvariant_derive
]

# ============================================================================
# LICENSES
# Checks dependency licenses against an allowlist
# ============================================================================
[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "LGPL-3.0-only", # mp3lame-encoder/mp3lame-sys (LAME MP3 encoder bindings)
]
confidence-threshold = 0.8

# mp3lame-encoder / mp3lame-sys declare the deprecated SPDX id "LGPL-3.0".
# Map it to the modern "LGPL-3.0-only" so cargo-deny stops warning about it.
[[licenses.clarify]]
name = "mp3lame-encoder"
expression = "LGPL-3.0-only"
license-files = []

[[licenses.clarify]]
name = "mp3lame-sys"
expression = "LGPL-3.0-only"
license-files = []

# ============================================================================
# BANS
# Deny or allow specific crates or versions
# ============================================================================
[bans]
# Duplicate crate versions are all transitive (Tauri, Leptos, html5ever, icu)
# and not something we can resolve from this workspace, so don't warn.
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"
deny = []
skip = []
skip-tree = []

# ============================================================================
# SOURCES
# Controls where crates can be sourced from
# ============================================================================
[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
# Allow rusty_ytdl from Mithronn's fork
github = ["Mithronn"]
